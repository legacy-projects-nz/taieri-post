<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16803f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Taieri Post">
<title>Taieri Post</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="stylesheet" href="/shared/style.css">
<link rel="stylesheet" href="/shared/driver.css">
</head>
<body>
<div id="app"><div class="wrap"><div class="top"><div><div class="brand">Taieri Post · driver portal</div><h1>Loading…</h1></div></div></div></div>
<script>
// If the app hasn't started after 12 seconds (no signal, or a file didn't load), say so and offer a retry instead of sitting on "Loading…"
setTimeout(function () { var h = document.querySelector("#app h1"); if (!h || h.textContent !== "Loading…") return; h.textContent = "Still loading…";
  var p = document.createElement("div"); p.className = "card"; p.innerHTML = '<p>This is taking longer than normal. Check your signal, then try again.</p><button class="btn" onclick="location.reload()">Try again</button>'; (document.querySelector("#app .wrap") || document.body).appendChild(p); }, 12000);
</script>
<script type="module" src="/app.js"></script>
</body>
</html>
